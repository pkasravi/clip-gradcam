[project]
name = "clip-gradcam"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.11.0",
    "clip",
    "ftfy>=6.3.1",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "pillow>=12.0.0",
    "regex>=2025.10.23",
    "scipy>=1.15.3",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "jupyterlab>=4.4.10",
]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
